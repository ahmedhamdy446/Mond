<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamo - Offline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mond</h1>
    <input type="text" id="search" placeholder="دور على أغنية...">
  </header>

  <div id="list"></div>

  <div class="player">
    <div class="player-info">
      <p id="title">اختار أغنية</p>
      <span id="time">0:00 / 0:00</span>
    </div>
    <div class="player-controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn" class="play">▶</button>
      <button id="nextBtn">⏭</button>
      <audio id="audio"></audio>
    </div>
    <button id="downloadBtn" class="dl">تحميل</button>
  </div>

  <script src="script.js"></script>

<!-- عداد + اشعار فوري ليك -->
<script data-goatcounter="https://ahmed-mond.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
  // اول ما حد يدخل يبعتلك اشعار
  fetch('https://ntfy.sh/mond-ahmedhamdy446', {
    method: 'POST',
    body: 'حد دخل موقع Mond بتاعك دلوقتي 🔥',
    headers: { 'Title': 'زائر جديد - Mond' }
  });
  
  // لو عايز العدد يظهر في الموقع نفسه
  fetch('https://api.countapi.xyz/hit/mond-ahmedhamdy446/visits')
    .then(r => r.json())
    .then(d => { 
      // هيطبع العدد في الكونسول، لو عايز تظهره حطه في عنصر
      console.log('عدد الزوار:', d.value);
    });
</script>
</script>
</body>
</html>
